<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ChatBox</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">
    <div class="logo">💬</div>
    <h1>Welcome Back</h1>
    <p>Login to continue chatting</p>

    <div id="errorMessage" style="color: #ff4d4d; margin-bottom: 15px; font-weight: bold;"></div>

    <form id="loginForm">
        <input type="email" id="email" placeholder="📧 Email" required autocomplete="email">
        <input type="password" id="password" placeholder="🔒 Password" required autocomplete="current-password">
        <button type="submit" id="loginBtn">🚀 Login</button>
    </form>

    <div class="footer-link" style="margin-top: 15px;">
        <p>Don't have an account? <a href="register.html">Register here</a></p>
    </div>
</div>

<script>
    const loginForm = document.getElementById("loginForm");
    const errorContainer = document.getElementById("errorMessage");

    // Replace YOUR_ACTUAL_RENDER_BACKEND_NAME with your real backend service URL on Render
    const API_BASE_URL = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1"
        ? "http://localhost:3000"
        : "https://chatbox-jibs.onrender.com";

    loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        errorContainer.style.color = "#ff4d4d";
        errorContainer.innerText = "Authenticating...";

        try {
            const response = await fetch(`${API_BASE_URL}/api/login`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();

            if (response.ok) {
                localStorage.setItem("token", data.token || "");
                localStorage.setItem("username", data.username || email.split('@')[0]);

                errorContainer.style.color = "#28a745";
                errorContainer.innerText = "Login successful! Redirecting...";

                setTimeout(() => {
                    window.location.href = "home.html";
                }, 1000);
            } else {
                errorContainer.innerText = data.message || "Invalid credentials. Please try again.";
            }
        } catch (error) {
            console.error("Login Error:", error);
            errorContainer.innerText = "Unable to connect to server. Please check your connection or server status.";
        }
    });
</script>

</body>
</html>
