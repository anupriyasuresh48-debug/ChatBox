<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ChatBox</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="logo">💬</div>

    <h1>Welcome Back</h1>

    <p>Login to continue chatting</p>

    <form id="loginForm">

        <input
            type="email"
            id="email"
            placeholder="📧 Email"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="🔒 Password"
            required
        >

        <button type="submit">
            🚀 Login
        </button>

    </form>

</div>

<script src="js/login.js"></script>

</body>
</html>
