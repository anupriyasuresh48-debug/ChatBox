<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ChatBox</title>

    <!-- Correct relative path to CSS inside Frontend/css/ directory -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Auto-Redirect if user is already logged in -->
    <script>
        if (localStorage.getItem("user")) {
            window.location.href = "home.html";
        }
    </script>
</head>

<body>

<div class="container">

    <div class="logo">💬</div>

    <h1>Welcome Back</h1>

    <p>Login to continue chatting</p>

    <!-- Message box for real-time error or success alerts -->
    <div id="errorMessage" style="color: #ff4d4d; margin-bottom: 15px; font-weight: bold; min-height: 20px;"></div>

    <form id="loginForm">
        <input
            type="email"
            id="email"
            placeholder="📧 Email"
            required
            autocomplete="email"
        >

        <input
            type="password"
            id="password"
            placeholder="🔒 Password"
            required
            autocomplete="current-password"
        >

        <button type="submit" id="loginBtn">
            🚀 Login
        </button>
    </form>

    <div class="footer-link" style="margin-top: 15px;">
        <p>Don't have an account? <a href="register.html">Register here</a></p>
    </div>

</div>

<!-- External JS link inside Frontend/js/ directory -->
<script src="js/login.js" defer></script>

</body>
</html>
