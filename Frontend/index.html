<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBox - Welcome</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- Auto-Redirect if user is already logged in -->
    <script>
        if (localStorage.getItem("user")) {
            window.location.href = "home.html";
        }
    </script>
</head>

<body>

    <div class="container">

        <div class="logo">💬</div>

        <h1>ChatBox</h1>

        <p>Welcome to ChatBox</p>

        <p>Chat instantly with your friends.</p>

        <button id="loginBtn" onclick="window.location.href='login.html'">Login</button>

        <button id="registerBtn" onclick="window.location.href='register.html'">Register</button>

    </div>

</body>
</html>
