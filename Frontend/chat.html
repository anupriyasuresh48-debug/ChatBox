<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - ChatBox</title>

    <!-- Correct relative paths for CSS -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="chat.css">
</head>

<body>

<div class="chat-container">

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>💬 ChatBox</h2>
        <div id="userList"></div>
    </div>

    <!-- Chat Area -->
    <div class="chat-area">

        <div class="chat-header">
            <h2 id="chatUser">Select a User</h2>
            <p>🟢 Online</p>
        </div>

        <div class="messages" id="chatBody"></div>

        <div class="message-box">
            <input
                type="text"
                id="messageInput"
                placeholder="Type a message..."
                autocomplete="off"
            >
            <button
                id="sendBtn"
                type="button">
                ➤
            </button>
        </div>

    </div>

</div>

<!-- Socket.io loaded via CDN so it works in both local and production environments -->
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<!-- Script file -->
<script src="chat.js"></script>

</body>
</html>
