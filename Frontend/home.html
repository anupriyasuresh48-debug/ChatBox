<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBox - Home</title>

    <!-- Relative path to CSS inside Frontend/css/ directory -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Auth Guard: Redirect if not logged in -->
    <script>
        const storedUser = localStorage.getItem("user");
        if (!storedUser) {
            window.location.href = "login.html";
        }
    </script>
</head>
<body>

<div class="home-container">

    <!-- Header -->
    <div class="header">
        <h2>🌈 ChatBox</h2>
        <div class="profile">
            <span id="userDisplayName">👤 Guest</span>
            <button id="logoutBtn" style="margin-left: 10px; cursor: pointer;">Logout</button>
        </div>
    </div>

    <!-- Search -->
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔍 Search Friends...">
    </div>

    <!-- Friend List (Populated dynamically from backend API) -->
    <div class="friend-list" id="friendList">
        <p style="text-align: center; color: #888;">Loading users...</p>
    </div>

</div>

<!-- Navigation, Search & Dynamic User Loading -->
<script>
    // Environment detection for backend requests
    // REPLACE 'YOUR-ACTUAL-RENDER-BACKEND-NAME' with your real backend service link on Render
    const BASE_URL = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1"
        ? "http://localhost:3000"
        : "https://YOUR-ACTUAL-RENDER-BACKEND-NAME.onrender.com";

    // 1. Parse and display logged-in user details
    const currentUserData = JSON.parse(localStorage.getItem("user") || "{}");
    const currentUsername = currentUserData.username || currentUserData.name || "User";
    document.getElementById("userDisplayName").innerText = `👤 ${currentUsername}`;

    // 2. Fetch users dynamically from backend
    async function loadUsers() {
        const friendList = document.getElementById("friendList");
        try {
            const response = await fetch(`${BASE_URL}/users`);
            const users = await response.json();

            friendList.innerHTML = "";

            if (!users || users.length === 0) {
                friendList.innerHTML = "<p style='text-align: center;'>No other users found.</p>";
                return;
            }

            users.forEach(user => {
                // Skip rendering the currently logged in user
                if (user.username === currentUsername) return;

                const card = document.createElement("div");
                card.className = "friend-card";
                card.setAttribute("data-username", user.username);
                card.style.display = "flex";
                card.style.cursor = "pointer";
                card.onclick = () => openChat(user.username);

                card.innerHTML = `
                    <div class="avatar">😊</div>
                    <div>
                        <h3>${user.username}</h3>
                        <p class="status online">🟢 Online</p>
                    </div>
                `;
                friendList.appendChild(card);
            });
        } catch (error) {
            console.error("Failed to load users:", error);
            friendList.innerHTML = "<p style='text-align: center; color: red;'>Unable to load users. Server may be sleeping.</p>";
        }
    }

    // 3. Redirect to chat page with selected user
    function openChat(friendName) {
        window.location.href = `chat.html?user=${encodeURIComponent(friendName)}`;
    }

    // 4. Search filter functionality
    const searchInput = document.getElementById("searchInput");
    searchInput.addEventListener("input", function (e) {
        const query = e.target.value.toLowerCase();
        const cards = document.querySelectorAll(".friend-card");

        cards.forEach(card => {
            const name = card.getAttribute("data-username").toLowerCase();
            card.style.display = name.includes(query) ? "flex" : "none";
        });
    });

    // 5. Handle Logout
    document.getElementById("logoutBtn").addEventListener("click", () => {
        localStorage.removeItem("user");
        localStorage.removeItem("token");
        window.location.href = "login.html";
    });

    // Run initial user list fetch
    loadUsers();
</script>

</body>
</html>
