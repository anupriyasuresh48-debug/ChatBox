<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - ChatBox</title>

    <!-- Relative path to CSS inside Frontend/css/ directory -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Auto-Redirect if user is already logged in -->
    <script>
        if (localStorage.getItem("user")) {
            window.location.href = "home.html";
        }
    </script>
</head>

<body>

<div class="container">

    <div class="logo">💬</div>

    <h1>Create Account</h1>

    <p>Sign up to start chatting with friends</p>

    <!-- Message box for real-time error or success alerts -->
    <div id="errorMessage" style="color: #ff4d4d; margin-bottom: 15px; font-weight: bold; min-height: 20px;"></div>

    <form id="registerForm">
        <input
            type="text"
            id="name"
            placeholder="👤 Full Name"
            required
            autocomplete="name"
        >

        <input
            type="text"
            id="username"
            placeholder="🏷️ Username"
            required
            autocomplete="username"
        >

        <input
            type="email"
            id="email"
            placeholder="📧 Email"
            required
            autocomplete="email"
        >

        <input
            type="password"
            id="password"
            placeholder="🔒 Password"
            required
            autocomplete="new-password"
        >

        <button type="submit" id="registerBtn">
            🎉 Register
        </button>
    </form>

    <div class="footer-link" style="margin-top: 15px;">
        <p>Already have an account? <a href="login.html">Login here</a></p>
    </div>

</div>

<!-- External JS link inside Frontend/js/ directory -->
<script src="js/register.js" defer></script>

</body>
</html>
