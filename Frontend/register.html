<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - ChatBox</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container">

    <div class="logo">🌈</div>

    <h1>Create Account</h1>

    <p>Join ChatBox and start chatting!</p>

    <form id="registerForm">

        <input
            type="text"
            id="name"
            placeholder="👤 Full Name"
            required
        >

        <input
            type="text"
            id="username"
            placeholder="😊 Username"
            required
        >

        <input
            type="email"
            id="email"
            placeholder="📧 Email"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="🔒 Password"
            required
        >

        <input
            type="password"
            id="confirmPassword"
            placeholder="🔒 Confirm Password"
            required
        >

        <button type="submit">
            🚀 Create Account
        </button>

    </form>

    <p class="bottom-text">
        Already have an account?
        <a href="login.html">Login</a>
    </p>

</div>

<script src="js/register.js"></script>

</body>
</html>
